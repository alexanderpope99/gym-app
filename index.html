<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cute Gym">
<meta name="theme-color" content="#f3e7cf">
<title>Cute Gym Tracker</title>
<script>try{var t=(JSON.parse(localStorage.getItem('fierflori_v1')||'{}').theme)||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3e7cf;--card:#fffaf0;--ink:#4a3426;--bd:#4a3426;--shadow:#4a3426;--soft:#8a7160;--tomato:#e2674a;--mustard:#e8b84a;--sage:#8fae7e;--teal:#3f9c94;--lav:#b7a3d6;--line:#d6c29f;--hi:#f6dcb0;--field:#fff;--tips:#fdf6e6;--note:#fff4c9;--noteink:#4a3426;--done:#eef4e6;--softbg:#f1eaf8;--warmdot:#fdf1dc;--tog:#e9dcc3;--dot:rgba(120,90,60,.08);--dot2:rgba(120,90,60,.05);--backdrop:rgba(60,40,25,.45);color-scheme:light}
:root[data-theme="dark"]{--paper:#241c2e;--card:#322840;--ink:#f4e6d4;--bd:#e3cfee;--shadow:#0f0a15;--soft:#b9a6c9;--tomato:#ff8f78;--mustard:#f2c566;--sage:#7fb77e;--teal:#4fb8ae;--lav:#8f76c9;--line:#554668;--hi:#4d3d62;--field:#2a2136;--tips:#3b3049;--note:#5a4a2c;--noteink:#fbeecd;--done:#2f3f33;--softbg:#3a2f52;--warmdot:#4a3c2a;--tog:#4a3e5a;--dot:rgba(255,235,250,.07);--dot2:rgba(255,220,160,.06);--backdrop:rgba(8,5,12,.65);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:18px;line-height:1.35;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px),radial-gradient(var(--dot2) 1px,transparent 1.3px);background-size:18px 18px,29px 29px;background-position:0 0,9px 14px;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));transition:background-color .3s}
h1,h2,h3{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;margin:0}
h2.big{font-size:32px;line-height:1.05;margin:2px 0}
h3{font-size:24px}
p{margin:8px 0}
ul,ol{padding-left:22px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:disabled{opacity:.35;cursor:default}
header{position:sticky;top:0;z-index:20;background:var(--paper);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;row-gap:4px;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:clamp(22px,6.4vw,30px);color:var(--tomato);white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
.brand .txt{display:inline-block}
.brand .logo{transition:transform .2s}
.brand:active .logo{transform:scale(.92)}
.logo{display:inline-block;flex:none;vertical-align:middle}
.logo svg{display:block;width:100%;height:100%;filter:drop-shadow(2px 2px 0 var(--shadow))}
.bounce{animation:pop .6s}
#hdrR{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.pill{display:inline-block;border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:16px;white-space:nowrap}
.pill.lav{background:var(--lav)}
.pill.name{background:var(--hi);font-family:'Caveat Brush',cursive;font-size:20px;line-height:1.2;max-width:42vw;overflow:hidden;text-overflow:ellipsis;box-shadow:2px 2px 0 var(--shadow)}
main{max-width:560px;margin:0 auto;padding:10px 14px}
.card{background:var(--card);border:2.5px solid var(--bd);border-radius:18px 6px 20px 8px/8px 20px 6px 18px;padding:14px;margin:16px 0;box-shadow:4px 5px 0 var(--shadow);position:relative;scroll-margin-top:90px}
.card:nth-of-type(even){border-radius:6px 20px 8px 18px/20px 8px 18px 6px}
.taped::before{content:'';position:absolute;top:-11px;left:50%;width:78px;height:22px;background:rgba(232,184,74,.6);transform:translateX(-50%) rotate(-3deg);border-left:3px dotted rgba(255,255,255,.7);border-right:3px dotted rgba(255,255,255,.7)}
.card.finished{background:var(--done)}
.card.soft{background:var(--softbg);border-style:dashed}
.meta{color:var(--soft);font-size:15px}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.row.mid{justify-content:center}
.btn{display:inline-block;font-size:18px;border:2.5px solid var(--bd);background:var(--mustard);color:#4a3426;padding:10px 16px;border-radius:14px 5px 14px 7px;box-shadow:3px 3px 0 var(--shadow);margin:4px 0}
.btn:active,.round:active,.dot:active,.gbtn:active{transform:translate(2px,2px);box-shadow:none}
.btn.tomato{background:var(--tomato);color:#fff8ee}
.btn.sage{background:var(--sage);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.small{font-size:15px;padding:5px 10px;box-shadow:2px 2px 0 var(--shadow)}
.btn.block{display:block;width:100%;margin-top:10px;text-align:center}
.linkish{background:none;border:none;padding:0;text-align:left;width:100%}
.linkish.meta{margin-top:12px;text-decoration:underline;text-align:center}
.hello{padding:6px 2px 0}
.hello h2{font-size:30px}
.ex-head{display:flex;gap:12px;align-items:center}
.ill{width:78px;height:64px;flex:none;background:#f8efdf;border:2px dashed var(--line);border-radius:14px 8px 12px 6px;display:grid;place-items:center}
.ill svg{width:70px;height:56px}
.ill.mini{width:50px;height:42px;border-radius:10px 6px 10px 5px}
.ill.mini svg{width:46px;height:37px}
.ex-title{font-family:'Caveat Brush',cursive;font-size:25px;line-height:1.05}
.hint{display:inline-block;background:var(--hi);border:2px solid var(--bd);border-radius:8px;padding:0 8px;font-size:15px;margin:3px 0}
.group-label{font-size:14px;color:var(--teal);margin-bottom:4px}
.dots{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 6px}
.dot{width:48px;height:48px;border-radius:52% 46% 50% 48%;border:2.5px solid var(--bd);background:var(--field);font-size:18px;box-shadow:2px 2px 0 var(--shadow);display:grid;place-items:center;padding:0}
.dot.warm{border-style:dashed;background:var(--warmdot);font-size:14px}
.dot.done{background:var(--sage);color:#fff;animation:pop .35s}
.dot.warm.done{background:var(--mustard);color:#4a3426}
@keyframes pop{50%{transform:scale(1.18) rotate(-8deg)}}
.wrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
input.kg{width:78px;font-family:inherit;font-size:21px;text-align:center;border:2px solid var(--bd);border-radius:10px;padding:4px;background:var(--field);color:var(--ink)}
.inp{width:100%;font-family:inherit;font-size:18px;border:2px solid var(--bd);border-radius:10px;padding:8px;background:var(--field);color:var(--ink)}
.round{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--bd);background:var(--card);font-size:22px;line-height:1;box-shadow:2px 2px 0 var(--shadow);padding:0}
.chip{display:inline-block;border:2px solid var(--bd);border-radius:999px;padding:3px 11px;font-size:15px;background:var(--field);margin:3px 2px}
.chip.on{background:var(--teal);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tips{background:var(--tips);border-left:4px solid var(--mustard);padding:8px 10px 8px 26px;margin:10px 0 0;border-radius:6px;font-size:16px}
div.tips{padding-left:12px}
.tips li{margin:4px 0}
.note{background:var(--note);color:var(--noteink);padding:6px 10px;margin-top:8px;border-radius:4px 10px 4px 10px;font-size:16px;transform:rotate(-.5deg);box-shadow:1px 2px 0 rgba(0,0,0,.25)}
.stamp{display:inline-block;transform:rotate(-1.5deg);border:2px dashed var(--tomato);color:var(--tomato);padding:4px 10px;border-radius:10px;font-size:16px;margin-top:10px;background:var(--field)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.tog{width:58px;height:34px;border-radius:20px;border:2.5px solid var(--bd);background:var(--tog);position:relative;flex:none;padding:0}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--bd);transition:left .2s}
.tog.on{background:var(--lav)}
.tog.on::after{left:27px}
textarea{width:100%;font-family:inherit;font-size:17px;border:2px solid var(--bd);border-radius:10px;padding:8px;background:var(--field);color:var(--ink);min-height:70px;margin-top:8px}
select{font-family:inherit;font-size:17px;border:2px solid var(--bd);border-radius:10px;padding:6px;background:var(--field);color:var(--ink);width:100%;margin:8px 0}
label{display:block;margin-top:10px}
.bar{height:16px;border:2px solid var(--bd);border-radius:999px;background:var(--field);overflow:hidden;margin:4px 0}
.bar div{height:100%;background:repeating-linear-gradient(45deg,var(--sage) 0 8px,#a7c296 8px 16px);transition:width .3s}
.wsub{font-family:'Caveat Brush',cursive;font-size:20px;color:var(--teal);margin:10px 0 4px}
.wsub .meta{font-family:'Patrick Hand',cursive}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wc{background:var(--tips);border:1.5px dashed var(--line);border-radius:12px 6px 12px 6px;padding:5px 3px;text-align:center;line-height:1.1}
.wc .we{display:block;font-size:22px;line-height:1.2}
.wc b{display:block;font-size:15px}
.wc small{display:block;font-size:12.5px;color:var(--soft);margin-top:1px}
.wl{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:16px;line-height:1.25;border-bottom:1px dashed var(--line)}
.wl:last-child{border-bottom:none}
.wl .we{flex:none;width:24px;text-align:center;font-size:19px}
.wl small{color:var(--soft);font-size:14px}
.rep{display:inline-block;background:var(--hi);border-radius:6px;padding:0 6px;font-size:14px}
.goal{display:flex;gap:8px;margin-top:8px}
.gbtn{flex:1;min-height:46px;border-radius:14px 6px 14px 6px;border:2.5px solid var(--bd);background:var(--field);font-size:24px;font-family:'Caveat Brush',cursive;box-shadow:2px 2px 0 var(--shadow);padding:4px 0}
.gbtn.on{background:var(--tomato);color:#fff}
.gbtn small{display:block;font-family:'Patrick Hand',cursive;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:2.5px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:none;font-size:14px;color:var(--soft);display:flex;flex-direction:column;align-items:center;padding:4px 12px;border-radius:14px}
nav button span{font-size:24px}
nav button.on{color:var(--ink);background:var(--hi)}
#rest{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:8px;background:var(--teal);color:#fff;border:2.5px solid var(--bd);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:3px 3px 0 var(--shadow);white-space:nowrap}
#rest.show{display:flex}
#rest b{font-size:26px;min-width:56px;text-align:center}
#rest button{border:2px solid var(--bd);background:var(--card);border-radius:999px;padding:3px 10px;font-size:15px}
#modal{position:fixed;inset:0;background:var(--backdrop);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 5vh) 12px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:480px;border:3px solid var(--bd);border-radius:24px 10px 24px 12px;padding:20px 16px;box-shadow:5px 6px 0 var(--shadow);animation:rise .25s ease-out;margin:0 auto 20px}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}}
@media(min-width:640px){#modal{padding-top:20px}.sheet{margin:auto}}
.energy{display:flex;justify-content:space-between}
.energy button{font-size:32px;background:none;border:2px solid transparent;border-radius:14px;padding:4px 8px}
.energy button.on{border-color:var(--bd);background:var(--field)}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;z-index:70;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.garden{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}
.plot{aspect-ratio:1;background:#b98a5e;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 3px,transparent 3px 10px);border:2.5px solid var(--bd);border-radius:12px 8px 14px 6px;display:grid;place-items:center;font-size:36px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.plot.grow{background-color:#94673f}
.plot.bloom{background:var(--pc);background-image:radial-gradient(circle at 20% 22%,rgba(255,255,255,.9) 0 2.5px,transparent 3.5px),radial-gradient(circle at 80% 28%,rgba(255,255,255,.75) 0 2px,transparent 3px),radial-gradient(circle at 74% 78%,rgba(255,255,255,.6) 0 2px,transparent 3px);box-shadow:inset 0 -9px 0 #a6c98b,2px 2px 0 var(--shadow);animation:pop .5s}
.stats{display:flex;justify-content:space-around;text-align:center;gap:6px}
.stats b{display:block;font-family:'Caveat Brush',cursive;font-size:30px;font-weight:400}
.stats span{font-size:14px;color:var(--soft)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:16px}
.cal div{padding:5px 0;border-radius:9px;border:2px solid transparent}
.cal .dh{color:var(--soft);font-size:14px}
.cal .has{background:var(--sage);color:#fff;border-color:var(--bd)}
.cal .has.cozy{background:var(--lav)}
.cal .skip{border:2px dashed var(--soft);color:var(--soft)}
.cal .today{border:2px dashed var(--tomato)}
.chart{width:100%;height:auto;margin-top:6px}
.chart text{font-family:'Patrick Hand',cursive;font-size:13px;fill:var(--soft)}
.chart circle{stroke:var(--bd)}
.log{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:2px dashed var(--line)}
.log.skipd{opacity:.8}
.x{background:none;border:none;font-size:18px;align-self:flex-start;opacity:.6}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.plan{display:block;width:100%;text-align:left;background:var(--field);border:2.5px dashed var(--bd);border-radius:14px 6px 14px 6px;padding:10px 12px;margin:8px 0}
.plan.on{border-style:solid;background:var(--hi);box-shadow:3px 3px 0 var(--shadow)}
.plan b{display:block;font-size:19px}
.plan span{display:block;font-size:15px}
.wline{display:grid;grid-template-columns:50px 1fr 72px 62px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:16px;line-height:1.15}
.wline input{width:100%;font-size:17px}
.filebtn input{display:none}
.big-emoji{font-size:80px;text-align:center;animation:pop .6s;line-height:1.1}
.big-emoji.sm{font-size:56px}
.conf{position:fixed;top:-40px;z-index:60;pointer-events:none;animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(340deg)}}
</style>
</head>
<body>
<header><h1 class="brand" onclick="go('azi')"><span id="hdrLogo"></span><span class="txt">Cute Gym Tracker</span></h1><div id="hdrR"></div></header>
<main id="app"></main>
<div id="rest"><span>☕ pauză</span><b id="restNum">1:30</b><button onclick="addRest(15)">+15s</button><button onclick="stopRest()">✕</button></div>
<div id="toast"></div>
<div id="modal" onclick="closeModal()"></div>
<nav>
<button data-t="azi" onclick="go('azi')"><span>🏋️‍♀️</span>Azi</button>
<button data-t="gradina" onclick="go('gradina')"><span>🌱</span>Grădina</button>
<button data-t="ghid" onclick="go('ghid')"><span>📖</span>Ghid</button>
<button data-t="setari" onclick="go('setari')"><span>⚙️</span>Setări</button>
</nav>
<script>
/* ============ utilitare ============ */
const KEY='fierflori_v1';
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const DAYS=['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];
const MONTHS=['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
const ENERGY=['😴','😐','🙂','😄','🔥'];
const FLOWERS=['🌷','🌻','🍓','🌸','🥕','🌼','🍅','🌹'];
const PASTEL=['#f9d3dc','#fbe7a6','#fbd0d0','#f6c9dc','#ffe0c2','#fff0b3','#ffd4c4','#f4c7d0'];
const YAY=['Bravo! 🎉','Floare! 🌸','Ce tare! 💪','Încă unul bifat ✨','Superb 🍓'];
const REASONS=['😴 obosită','🤒 nu mă simt bine','💼 muncă','✈️ plecată','🎮 seară de joacă','🌼 altceva'];
const DONEMSG=['Ai fost minunată azi! 🌟','Mușchii tăi îți mulțumesc 💐','Grădina a primit apă azi 💧','Treabă bună, acum relaxare 🛁','Încă o cărămidă la forma ta 🧱✨'];
const SKIPMSG=['Azi e zi de pătură și ceai 🍵','Odihna e tot antrenament, doar mai pufos ☁️','Și florile au nevoie de o zi fără stropit 🌷','Recuperare activată 🔋','O zi liniștită e tot o alegere bună 💛'];
const STEP=0.25, PER=6;
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const todayKey=()=>ymd(Date.now());
const hm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const dm=t=>{const d=new Date(t);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)};
const fmt=sec=>{const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const fmtKg=n=>n==null?'':String(Math.round(n*100)/100).replace('.',',');
function parseNum(v){v=String(v).trim().replace(',','.');if(v==='')return null;const n=parseFloat(v);return isNaN(n)?undefined:n}
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function greet(){const h=new Date().getHours();return h<5?'Noapte bună':h<12?'Bună dimineața':h<18?'Bună ziua':'Bună seara'}

/* ============ logo (kettlebell zâmbăreț) ============ */

function todayPlan(){const p=P[S.plan],wd=new Date().getDay(),next=p.seq[S.idx%p.seq.length];
 if(S.mode==='next'||!p.days)return{wid:next,reason:'Următorul la rând ✨'};
 if(p.days[wd])return{wid:p.days[wd],reason:'Azi e '+DAYS[wd]+' ✨'};
 return{wid:null,next}}
function nextInfo(){const p=P[S.plan];
 if(S.mode==='next'||!p.days){const k=p.seq[S.idx%p.seq.length];return `${W[k].em} ${W[k].n}`}
 const wd=new Date().getDay();for(let d=1;d<=7;d++){const k=p.days[(wd+d)%7];if(k)return `${DAYS[(wd+d)%7]} · ${W[k].em} ${W[k].n}`}return '—'}
function todayLog(){const k=todayKey();return [...S.logs].reverse().find(l=>ymd(l.date)===k)}
function newSession(wid,start){return{wid,created:Date.now(),start:start||null,done:{},warm:{},alt:{},kg:{},top:{}}}
function ensure(){if(!S.session){const tp=todayPlan();S.session=newSession(tp.wid||P[S.plan].seq[0])}return S.session}
function dropStale(){const s=S.session;if(!s)return;if(!W[s.wid]||(!s.start&&ymd(s.created)!==todayKey())){S.session=null;save()}}
function curEx(key,sl){return(S.session&&S.session.alt[key])||sl.e}
function baseKg(id){return S.w[id]!=null?S.w[id]:ex(id).kg}
function shownKg(id){const s=S.session;if(s&&s.kg[id]!=null)return s.kg[id];const b=baseKg(id);return(S.cozy&&b!=null)?Math.round(b*0.7*4)/4:b}
function setting(id){return S.set[id]!=null?S.set[id]:ex(id).set}
function sets(sl){return S.cozy?Math.max(sl.core?1:2,sl.s-1):sl.s}
function topRep(r){const m=r.match(/\d+/g);return m?m[m.length-1]:'max'}
function slotsOf(w){return[...w.list.map((sl,i)=>[sl,'m'+i]),...(w.bonus||[]).map((sl,i)=>[{...sl,bonus:1},'b'+i])]}
function progress(){const s=S.session;if(!s||!W[s.wid])return{total:0,cnt:0};let total=0,cnt=0;
 slotsOf(W[s.wid]).forEach(([sl,key])=>{const n=sets(sl);cnt+=(s.done[key]||[]).slice(0,n).filter(Boolean).length;if(!sl.bonus&&!(S.cozy&&sl.opt))total+=n});return{total,cnt}}
function hearts(){const goal=S.goal||2,ws=weekStart(Date.now()).getTime();const c=S.logs.filter(l=>new Date(l.date).getTime()>=ws).length;
 return '❤️'.repeat(Math.min(c,goal))+'🤍'.repeat(Math.max(0,goal-c))+(c>goal?'💖'.repeat(Math.min(c-goal,3)):'')}

 if(nx===main)delete s.alt[key];else s.alt[key]=nx;save();render();toast('Acum: '+ex(nx).n)}
function toggleTop(id){const s=ensure();s.top[id]=!s.top[id];if(s.top[id])S.top[id]=shownKg(id);else delete S.top[id];save();render()}

function flip(k){S[k]=!S[k];save();render()}

let restT=null,restEnd=0,AC=null;
function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){if(!S.sound||!AC)return;[660,880,990].forEach((f,i)=>{const t=AC.currentTime+i*0.18,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.2)});
 if(navigator.vibrate)navigator.vibrate([120,60,120])}
function startRest(sec){if(!S.restOn)return;restEnd=Date.now()+sec*1000;clearInterval(restT);restT=setInterval(tickRest,250);tickRest();$('#rest').classList.add('show')}
function tickRest(){const left=Math.ceil((restEnd-Date.now())/1000);if(left<=0){stopRest();beep();toast('Gata pauza! 💪');return}$('#restNum').textContent=fmt(left)}
function addRest(x){restEnd+=x*1000;tickRest()}
function stopRest(){clearInterval(restT);restT=null;$('#rest').classList.remove('show')}

let tt,askCb=null;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800)}
function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">${html}</div>`;m.classList.add('show');m.scrollTop=0}
function closeModal(){$('#modal').classList.remove('show');if(askCb){const cb=askCb;askCb=null;cb(false)}}
function ask({emoji='🤔',title,text='',ok='Da',cancel='Renunță',danger=0}){
 if(askCb){const c=askCb;askCb=null;c(false)}
 return new Promise(res=>{askCb=res;modal(`<div class="big-emoji sm">${emoji}</div><h2 class="big center">${title}</h2>${text?`<p class="center">${text}</p>`:''}<button class="btn ${danger?'tomato':''} block" onclick="answer(true)">${ok}</button>${cancel?`<button class="btn ghost block" onclick="answer(false)">${cancel}</button>`:''}`)})}
function answer(v){const cb=askCb;askCb=null;closeModal();if(cb)cb(v)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('show'))closeModal()});
function openPicker(){const p=P[S.plan];const b=k=>`<button class="plan" onclick="pickW('${k}')"><b>${W[k].em} ${W[k].n}</b><span class="meta">${W[k].sub}</span></button>`;
 modal(`<h2>Ce facem azi? 🤔</h2><p class="meta">Din planul tău</p>${[...new Set(p.seq)].map(b).join('')}<p class="meta">Alte antrenamente</p>${Object.keys(W).filter(k=>!p.seq.includes(k)).map(b).join('')}<button class="btn ghost block" onclick="closeModal()">Închide</button>`)}
async function pickW(k){const s=S.session;const any=s&&Object.values(s.done).some(a=>a.some(Boolean));
 if(any&&!await ask({emoji:'🔄',title:'Schimbi antrenamentul?',text:'Ai deja serii bifate. Dacă schimbi, bifele se pierd (greutățile rămân).',ok:'Da, schimb',cancel:'Nu'}))return;
 S.session=newSession(k,s&&s.start);save();closeModal();render()}

 let dur='',tracked='';if(s.start){const m=Math.max(1,Math.round((Date.now()-s.start)/60000));if(m<=300){dur=m;tracked=`⏱ cronometrat: ${m} min (îl poți modifica)`}}
 modal(`<h2 class="big">${cnt?'Bravo! 🎉':'Gata pe azi?'}</h2><p>${cnt}/${total} serii bifate${s.start?' · început la '+hm(s.start):''}</p>
 <label>Durată (minute)</label><input id="fDur" class="inp" inputmode="numeric" value="${dur}" placeholder="ex: 50">${tracked?`<div class="meta">${tracked}</div>`:''}
 <p>Cum a fost energia?</p><div class="energy">${ENERGY.map((x,i)=>`<button id="en${i}" onclick="setEnergy(${i})">${x}</button>`).join('')}</div>
 <label>Notiță (opțional)</label><textarea id="fNote" placeholder="ex: la RDL a fost greu, data viitoare…"></textarea>
 <button class="btn tomato block" onclick="finish()">Salvez în jurnal 🌱</button><button class="btn ghost block" onclick="closeModal()">Mai am puțin</button>`)}
function setEnergy(i){UI.energy=i;ENERGY.forEach((_,j)=>$('#en'+j).classList.toggle('on',j===i))}
function finish(){const s=S.session;if(!s){closeModal();return}const{total,cnt}=progress();const exs=[];
 slotsOf(W[s.wid]).forEach(([sl,key])=>{const d=(s.done[key]||[]).filter(Boolean).length;if(!d)return;const id=curEx(key,sl);exs.push({id,kg:ex(id).bw?null:shownKg(id),sets:d})});
 const end=Date.now();
 S.logs.push({id:end,date:new Date(s.start||end).toISOString(),end:new Date(end).toISOString(),wid:s.wid,dur:parseInt($('#fDur').value)||null,energy:UI.energy,note:$('#fNote').value.trim(),cozy:S.cozy,done:cnt,total,ex:exs});
 const seq=P[S.plan].seq,pos=seq.indexOf(s.wid);if(pos>=0)S.idx=(seq[S.idx%seq.length]===s.wid)?S.idx+1:pos+1;
 S.session=null;stopRest();save();closeModal();celebrate()}
function gardenState(){const n=S.logs.length,p=n?((n-1)%24)+1:0,harvest=n?Math.floor((n-1)/24):0,plots=[];
 for(let i=0;i<8;i++){const st=Math.max(0,Math.min(3,p-3*i)),k=(i+harvest)%FLOWERS.length;
  plots.push({st,e:st===0?'':st===1?'🌱':st===2?'🌿':FLOWERS[k],c:PASTEL[k]})}return{n,p,harvest,plots}}
function celebrate(){render();const g=gardenState(),left=3-g.p%3,bloom=g.p%3===0;confetti();

function backupText(){return JSON.stringify({app:'cutegymtracker',v:4,exported:new Date().toISOString(),state:Object.assign({},S,{session:null})})}
function backupDone(){S.lastBackup=Date.now();save();render();toast('Backup gata 💾')}
async function exportData(){const t=backupText(),name='cute-gym-backup-'+todayKey()+'.json';
 try{const f=new File([t],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Backup Cute Gym Tracker'});backupDone();return}}
 catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);backupDone()}

 .catch(()=>modal(`<h3>Copiază textul de mai jos</h3><textarea style="min-height:200px">${esc(t)}</textarea><button class="btn block" onclick="closeModal()">Gata</button>`))}

async function importText(t){let st;try{const o=JSON.parse(t);st=o&&o.state?o.state:o;if(!st||!Array.isArray(st.logs))throw 0}
 catch(e){await ask({emoji:'🤔',title:'Hmm…',text:'Asta nu pare un backup valid. Verifică fișierul sau textul.',ok:'Ok',cancel:null});return}
 if(!await ask({emoji:'💾',title:'Încarc backup-ul?',text:'Datele de acum vor fi înlocuite cu cele din backup.',ok:'Da, încarcă',cancel:'Renunță'}))return;
 S=Object.assign(clone(DEF),st);save();applyTheme();render();toast('Backup încărcat 🌼')}
function importFile(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(String(r.result));r.readAsText(f);ev.target.value=''}

 const all=Object.values(W).map(w=>`<p><b>${w.em} ${w.n}</b><br><span class="meta">${w.list.map(sl=>`${ex(sl.e).n} ${sl.s}×${sl.r}`).join(' · ')}</span></p>`).join('');
 const li=a=>`<ul>${a.map(x=>`<li>${x[0]} <b>${x[1]}</b>: ${x[2]} · ${x[3]}</li>`).join('')}</ul>`;
 const warmH=`<p>~5 minute, fără pauze: întâi articulațiile de la gât în jos, apoi câteva mișcări specifice zilei.</p><p><b>1. Articulații (în fiecare zi)</b></p>${li(JOINTS)}<p><b>2a. Zi de picioare</b></p>${li(WEX.lower)}<p><b>2b. Zi de upper</b></p>${li(WEX.upper)}<p><b>2c. Zi full body</b></p>${li(WEX.full)}<p><b>3.</b> O serie ușoară (~jumătate din greutate × 8–10) la primele exerciții. Când greutățile cresc mult, poți adăuga încă una la ~75% × 3–5.</p>`;
 const secs=[{k:'warm',t:'🔥 Încălzire',h:warmH},...GUIDE,{k:'all',t:'📋 Toate antrenamentele',h:all}];
 secs.forEach(x=>{const o=UI.guide[x.k];h+=`<div class="card" id="g-${x.k}"><button class="linkish" onclick="UI.guide['${x.k}']=!UI.guide['${x.k}'];render()"><h3>${x.t} <span class="meta">${o?'▴':'▾'}</span></h3></button>${o?(x.ill?`<div class="ill" style="margin:8px 0">${ILL[x.ill]}</div>`:'')+x.h:''}</div>`});
 return h}

function vSettings(){const p=P[S.plan],nx=p.seq[S.idx%p.seq.length];
 let h=`<div class="hello"><h2>Setări ⚙️</h2></div>`;
 h+=`<div class="card"><label style="margin-top:0">Cum te strig? 💌</label><input class="inp" value="${esc(S.name)}" placeholder="numele tău" maxlength="24" oninput="S.name=this.value.trim();save();renderHeader()"></div>`;
 h+=`<div class="card"><h3>🎨 Temă</h3><div class="goal">${[['light','☀️','Zi'],['dark','🌌','Noapte'],['auto','🌓','Auto']].map(([k,e,l])=>`<button class="gbtn ${S.theme===k?'on':''}" onclick="setTheme('${k}')">${e}<small>${l}</small></button>`).join('')}</div><p class="meta">Auto = urmează setarea telefonului sau a calculatorului.</p></div>`;
 h+=`<div class="card"><h3>🎯 Obiectiv pe săptămână</h3><div class="goal">${[1,2,3,4,5].map(n=>`<button class="gbtn ${S.goal===n?'on':''}" onclick="setGoal(${n})">${n}</button>`).join('')}</div><p class="meta">${S.goal} ${S.goal===1?'antrenament':'antrenamente'} pe săptămână · inimioarele din „Azi” urmăresc asta.</p>${S.goal>=4?'<p class="meta">💡 La 4–5 zile, lasă măcar o zi între antrenamentele grele pentru aceleași grupe (de ex. o rotație cu upper/lower).</p>':''}</div>`;
 h+=`<div class="card taped"><h3>🗂️ Planul</h3>${Object.entries(P).map(([k,q])=>`<button class="plan ${S.plan===k?'on':''}" onclick="setPlan('${k}')"><b>${q.star?'⭐ ':''}${q.n}</b><span>${q.d}</span><span class="meta">${q.seq.map(w=>W[w].em+' '+W[w].n).join(' → ')}</span></button>`).join('')}<p class="meta">Următorul la rând: ${W[nx].em} ${W[nx].n}</p></div>`;
 h+=`<div class="card"><h3>🗓️ Cum aleg antrenamentul</h3><div class="row"><button class="chip ${S.mode==='day'?'on':''}" onclick="S.mode='day';save();render()">după zi</button><button class="chip ${S.mode==='next'?'on':''}" onclick="S.mode='next';save();render()">următorul la rând</button></div><p class="meta">${S.mode==='day'?'În zilele planului îți arăt antrenamentul zilei.':'Îți arăt mereu următorul antrenament, în orice zi. Dacă sari o zi, nu se strică nimic.'}${p.days?'':' (Planul ăsta e oricum o rotație.)'}</p></div>`;
 h+=`<div class="card"><div class="switch"><span>🌙 Zi cozy</span><button class="tog ${S.cozy?'on':''}" onclick="toggleCozy()"></button></div><div class="switch"><span>⏱️ Timer de pauză</span><button class="tog ${S.restOn?'on':''}" onclick="flip('restOn')"></button></div><div class="switch"><span>🔔 Sunet la final de pauză</span><button class="tog ${S.sound?'on':''}" onclick="flip('sound')"></button></div><p class="meta">Sunetul nu se aude dacă iPhone-ul e pe silențios.</p></div>`;
 h+=`<div class="card"><button class="linkish" onclick="tog('weights')"><h3>🏋️ Greutățile mele <span class="meta">${UI.open.weights?'▴':'▾'}</span></h3></button>${UI.open.weights?`<p class="meta">Apasă pe nume ca să setezi reglajul aparatului 🔧</p>`+Object.keys(EX).filter(id=>!ex(id).bw).map(id=>{const e=ex(id),st=setting(id);return `<div class="wline"><div class="ill mini">${ILL[e.i]||ILL.stretch}</div><button class="linkish" onclick="editSet('${id}')">${esc(e.n)}${st?`<br><span class="meta">🔧 ${esc(st)}</span>`:''}</button><input class="kg" inputmode="decimal" value="${fmtKg(baseKg(id))}" placeholder="—" onchange="setBase('${id}',this.value)"><span class="meta">${e.u}</span></div>`}).join(''):''}</div>`;
 h+=`<div class="card"><h3>💾 Backup</h3><p class="meta">Datele tale stau în Safari, pe telefon. Un backup din când în când = liniște. ${S.lastBackup?'Ultimul: '+dm(S.lastBackup)+'.':'Încă niciunul.'}</p><button class="btn block" onclick="exportData()">Salvează backup (fișier)</button><button class="btn ghost block" onclick="copyData()">Copiază ca text</button><label class="btn ghost block filebtn">Încarcă din fișier<input type="file" accept=".json,application/json,text/plain" onchange="importFile(event)"></label><button class="btn ghost block" onclick="openPaste()">Lipește text de backup</button></div>`;
 h+=`<div class="card soft"><h3>📱 Pune-o pe ecranul principal</h3><p>În Safari: butonul <b>Share</b> (pătratul cu săgeată) → <b>Add to Home Screen</b>. Arată ca o aplicație și iPhone-ul nu-i mai șterge datele dacă n-o deschizi o vreme.</p></div>`;
 h+=`<button class="btn ghost block" onclick="resetAll()">🧹 Șterge tot</button>
 <div class="center" style="margin-top:22px">${logo(64)}</div><p class="meta center" style="margin-top:6px">Cute Gym Tracker · făcută cu drag 💛</p>`;
 return h}

function renderHeader(){const s=S.session;
 $('#hdrR').innerHTML=(S.cozy?'<span class="pill lav">🌙</span>':'')
  +(s&&s.start&&ymd(s.start)===todayKey()?`<span class="pill" id="clock">⏱ ${fmt(Math.floor((Date.now()-s.start)/1000))}</span>`:'')
  +(S.name?`<button class="pill name" onclick="go('setari')">💖 ${esc(S.name)}</button>`:'')}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===UI.tab));
 $('#app').innerHTML=UI.tab==='azi'?vAzi():UI.tab==='gradina'?vGarden():UI.tab==='ghid'?vGuide():vSettings();
 renderHeader()}
setInterval(()=>{const c=$('#clock');if(c&&S.session&&S.session.start)c.textContent='⏱ '+fmt(Math.floor((Date.now()-S.session.start)/1000))},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(restT)tickRest();if(!document.activeElement||document.activeElement===document.body)render()}});

/* ============ favicon + iconiță ecran principal ============ */
(function(){
 function link(rel,href,type,sizes){const l=document.createElement('link');l.rel=rel;l.href=href;if(type)l.type=type;if(sizes)l.setAttribute('sizes',sizes);document.head.appendChild(l)}
 function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
 function png(size,full){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  if(full){x.fillStyle=LBG;x.fillRect(0,0,size,size);const s=size/64*1.08;x.translate(size/2,size/2);x.scale(s,s);x.translate(-32,-31)}
  else{x.scale(size/64,size/64);rr(x,1.5,1.5,61,61,16);x.fillStyle=LBG;x.fill();x.lineWidth=3;x.strokeStyle=LK;x.stroke()}
  x.lineCap='round';x.lineJoin='round';
  const st=(d,w,col)=>{x.lineWidth=w;x.strokeStyle=col||LK;x.stroke(new Path2D(d))};
  const fl=(d,col)=>{x.fillStyle=col;x.fill(new Path2D(d))};
  const dot=(cx,cy,r,col)=>{x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fillStyle=col;x.fill()};
  st(LP.h,5);
  fl(LP.l1,LLEAF);st(LP.l1,1.8);fl(LP.l2,LLEAF);st(LP.l2,1.8);
  x.beginPath();x.arc(32,40,16,0,Math.PI*2);x.fillStyle=LRED;x.fill();x.lineWidth=3;x.strokeStyle=LK;x.stroke();
  x.globalAlpha=.75;st(LP.sh,2.2,'#fff');x.globalAlpha=1;
  dot(23.5,44,2.6,LCHEEK);dot(40.5,44,2.6,LCHEEK);dot(26.5,39,2.3,LK);dot(37.5,39,2.3,LK);
  st(LP.sm,2.2);
  return c.toDataURL('image/png')}
 document.querySelectorAll('link[rel~="icon"],link[rel="apple-touch-icon"]').forEach(l=>l.remove());
 link('icon','data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO_SVG),'image/svg+xml');
 try{link('icon',png(64,false),'image/png','64x64');link('apple-touch-icon',png(180,true),null,'180x180')}catch(e){}
})();

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
$('#hdrLogo').outerHTML=logo(38);
applyTheme();
render();
</script>
</body>
